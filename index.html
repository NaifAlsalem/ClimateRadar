/* ─── RADAR ─── */
// Converts filtered alert list &#8594; stable blip positions using golden-angle spread
const alertsToBlips=(alerts)=>{
  const GA=2.39996; // golden angle in radians — avoids clustering
  const riskR={High:.35,Medium:.62,Low:.82}; // inner=dangerous, outer=low
  return alerts.map((a,i)=>({
    a:(i*GA)%(Math.PI*2),
    r:riskR[a.risk]||.6,
    risk:a.risk,
    id:a.id
  }));
};

const Radar=({size=290,alerts=[]})=>{
  const ref=useRef(null);
  const alertsRef=useRef(alerts);
  const trailsRef=useRef({});

  // keep ref in sync without restarting animation
  useEffect(()=>{
    // reset trails for blips that disappeared
    const ids=new Set(alerts.map(a=>a.id));
    Object.keys(trailsRef.current).forEach(k=>{ if(!ids.has(Number(k))) delete trailsRef.current[k]; });
    alertsRef.current=alerts;
  },[alerts]);

  useEffect(()=>{
    const c=ref.current;if(!c)return;
    const ctx=c.getContext("2d");
    let ang=0,id;
    const draw=()=>{
      const W=c.width,H=c.height,cx=W/2,cy=H/2,R=Math.min(W,H)/2-12;
      ctx.clearRect(0,0,W,H);
      const g=ctx.createRadialGradient(cx,cy,0,cx,cy,R);
      g.addColorStop(0,"rgba(0,50,28,.5)");g.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fill();
      [.25,.5,.75,1].forEach(r=>{
        ctx.beginPath();ctx.arc(cx,cy,R*r,0,Math.PI*2);
        ctx.strokeStyle=`rgba(0,200,150,${r===1?.2:.1})`;ctx.lineWidth=r===1?1.2:.7;ctx.stroke();
      });
      [0,Math.PI/6,Math.PI/3,Math.PI/2,2*Math.PI/3,5*Math.PI/6].forEach(a=>{
        ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R);
        ctx.lineTo(cx-Math.cos(a)*R,cy-Math.sin(a)*R);
        ctx.strokeStyle="rgba(0,200,150,.07)";ctx.lineWidth=.5;ctx.stroke();
      });
      for(let i=0;i<80;i++){
        const sa=ang-(i*Math.PI)/120;
        ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,sa,sa+Math.PI/120);
        ctx.fillStyle=`rgba(0,220,130,${(1-i/80)*.24})`;ctx.fill();
      }
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(ang)*R,cy+Math.sin(ang)*R);
      ctx.strokeStyle="rgba(0,245,155,.95)";ctx.lineWidth=2;ctx.stroke();

      // draw blips from live alertsRef
      const blips=alertsToBlips(alertsRef.current);
      blips.forEach((b)=>{
        if(!trailsRef.current[b.id]) trailsRef.current[b.id]=[];
        const trail=trailsRef.current[b.id];
        const bx=cx+Math.cos(b.a)*R*b.r,by=cy+Math.sin(b.a)*R*b.r;
        const diff=((b.a-ang)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
        const fresh=diff<.35?1:diff>5.9?(6.28-diff)/.38:0;
        if(fresh>0)trail.push({x:bx,y:by,a:fresh});
        if(trail.length>10)trail.shift();
        const col=b.risk==="High"?"255,60,60":b.risk==="Medium"?"255,180,0":"0,200,120";
        trail.forEach((t,ti)=>{ctx.beginPath();ctx.arc(t.x,t.y,3,0,Math.PI*2);ctx.fillStyle=`rgba(${col},${(ti/trail.length)*t.a*.6})`;ctx.fill();});
        ctx.beginPath();ctx.arc(bx,by,5,0,Math.PI*2);ctx.fillStyle=`rgba(${col},.95)`;ctx.fill();
        ctx.beginPath();ctx.arc(bx,by,11,0,Math.PI*2);ctx.strokeStyle=`rgba(${col},.22)`;ctx.lineWidth=1;ctx.stroke();
      });

      // show "no results" pulse when empty
      if(blips.length===0){
        ctx.beginPath();ctx.arc(cx,cy,R*.5,0,Math.PI*2);
        ctx.strokeStyle=`rgba(100,100,100,${.1+.05*Math.sin(ang*4)})`;ctx.lineWidth=1;ctx.stroke();
      }

      ctx.beginPath();ctx.arc(cx,cy,5,0,Math.PI*2);ctx.fillStyle="rgba(0,245,155,.9)";ctx.fill();
      ctx.beginPath();ctx.arc(cx,cy,11,0,Math.PI*2);ctx.strokeStyle="rgba(0,245,155,.3)";ctx.lineWidth=1;ctx.stroke();
      ang=(ang+.018)%(Math.PI*2);id=requestAnimationFrame(draw);
    };
    draw();return()=>cancelAnimationFrame(id);
  },[]);
  return <canvas ref={ref} width={size} height={size} style={{borderRadius:"50%",display:"block"}}/>;
};

  doc.text("Strategic Intelligence Report",14,24);
  doc.setFontSize(9);doc.setTextColor(100,160,130);
  doc.text("Prepared by: Naif Alsalem",14,31);
  doc.text("Generated: "+new Date().toLocaleString(),W-70,31);
  y=44;

  if(keywords.length){
    doc.setFontSize(9);doc.setTextColor(0,200,120);doc.setFont("helvetica","bold");
    doc.text("ACTIVE KEYWORD WATCH: "+keywords.join(" · "),14,y);y+=10;
  }

  // stats
  doc.setFillColor(8,28,18);doc.rect(14,y-4,W-28,12,"F");
  doc.setFontSize(9);doc.setTextColor(0,200,120);doc.setFont("helvetica","normal");

  const me=alerts.filter(a=>a.risk==="Medium").length;
  const lo=alerts.filter(a=>a.risk==="Low").length;
  doc.text(`Total: ${alerts.length} signals`,16,y+4);
  doc.setTextColor(220,50,50);doc.text(`High: ${hi}`,60,y+4);
  doc.setTextColor(220,160,0);doc.text(`Medium: ${me}`,90,y+4);
  doc.setTextColor(0,180,100);doc.text(`Low: ${lo}`,125,y+4);
  y+=18;

  doc.setFontSize(12);doc.setTextColor(0,220,130);doc.setFont("helvetica","bold");
  doc.text("INTELLIGENCE FEED",14,y);y+=8;

  alerts.forEach((a,i)=>{
    np();
    const rc=a.risk==="High"?[200,40,40]:a.risk==="Medium"?[200,140,0]:[0,160,90];
    const bg=a.risk==="High"?[40,8,8]:a.risk==="Medium"?[40,28,4]:[4,28,16];
    doc.setFillColor(...bg);doc.rect(14,y-4,W-28,30,"F");
    doc.setFillColor(...rc);doc.rect(14,y-4,3,30,"F");
    doc.setFontSize(11);doc.setTextColor(220,240,228);doc.setFont("helvetica","bold");
    doc.text(`${i+1}. ${a.title}`,20,y+3);
    doc.setFontSize(8);doc.setTextColor(...rc);
    doc.text(`[ ${a.risk.toUpperCase()} ]  ${a.category}`,W-50,y+3);
    doc.setFontSize(9);doc.setTextColor(160,200,180);doc.setFont("helvetica","normal");
    const lines=doc.splitTextToSize(a.summary,W-40);
    doc.text(lines,20,y+11);
    doc.setFontSize(8);doc.setTextColor(80,140,100);
    doc.text(`Source: ${a.source}   Date: ${a.date}`,20,y+24);
    if(a.link&&a.link!=="undefined"&&a.link!=="#"){
      doc.setTextColor(0,140,200);
      doc.textWithLink("View Source",20,y+28,{url:a.link});
    }
    y+=36;np();
  });

  // Footer red line
  doc.setDrawColor(200,30,30);doc.setLineWidth(.6);doc.line(14,279,W-14,279);
  // Footer text — bold red
  doc.setFontSize(8.5);doc.setTextColor(210,30,30);doc.setFont("helvetica","bold");
  doc.text("Strategic Intelligence | Naif Alsalem",14,284);
  doc.text("CONFIDENTIAL",W-32,284);
  doc.save("ClimateRadar_"+new Date().toISOString().slice(0,10)+".pdf");
};

/* ─── APP ─── */
function App(){
  const [alerts,setAlerts]=useState(ALL_ALERTS);
  const [filter,setFilter]=useState("All");
  const [tab,setTab]=useState("alerts");
  const [search,setSearch]=useState("");
  const [sel,setSel]=useState(null);
  const [scanning,setScanning]=useState(false);
  const [scanMsg,setScanMsg]=useState("");
  const [keywords,setKeywords]=useState(["fossil fuel","CBAM","phase-out"]);
  const [newKw,setNewKw]=useState("");
  const [kwResults,setKwResults]=useState([]);
  const [lastScan,setLastScan]=useState("06 May 2026, 09:14 GST");
  const [linkStatus,setLinkStatus]=useState({});
  const [recentOnly,setRecentOnly]=useState(false);
  const [sourcesScanned,setSourcesScanned]=useState(1284);
  const [scanCount,setScanCount]=useState(0);
  const [isLive,setIsLive]=useState(false);

  const daysOld=(dateStr)=>{
    const diff=Date.now()-new Date(dateStr).getTime();
    return Math.floor(diff/(1000*60*60*24));
  };
  const freshnessLabel=(d)=>{
    if(d<=7) return {label:"NEW",color:"#00e87a"};
    if(d<=30) return {label:"RECENT",color:"#00c878"};
    if(d<=90) return {label:`${d}D AGO`,color:"#ffb400"};
    return {label:"STALE",color:"#ff6060"};
  };

  const verifyLink=async(alertId,url)=>{
    if(!url||url==="#") return;
    setLinkStatus(s=>({...s,[alertId]:"checking"}));
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),7000);
    try{
      await fetch(url,{method:"HEAD",mode:"no-cors",signal:controller.signal,cache:"no-store"});
      clearTimeout(timer);
      // no-cors gives opaque response — domain is reachable
      setLinkStatus(s=>({...s,[alertId]:"ok"}));
    }catch(e){
      clearTimeout(timer);
      if(e.name==="AbortError"){
        setLinkStatus(s=>({...s,[alertId]:"timeout"}));
      }else{
        // Network error = truly unreachable
        setLinkStatus(s=>({...s,[alertId]:"fail"}));
      }
    }
  };

  // Auto-verify link when a signal is selected
  useEffect(()=>{
    if(sel&&!linkStatus[sel.id]){
      verifyLink(sel.id,sel.link);
    }
  },[sel]);

  const filtered=alerts.filter(a=>
    (filter==="All"||a.category===filter)&&
    (!recentOnly||daysOld(a.date)<=90)&&
    (search===""||a.title.toLowerCase().includes(search.toLowerCase())||a.summary.toLowerCase().includes(search.toLowerCase()))
  );

  // Search filtered kwResults too
  const filteredKw=kwResults.filter(a=>
    search===""||a.title.toLowerCase().includes(search.toLowerCase())||a.summary.toLowerCase().includes(search.toLowerCase())
  );

  const handleSearch=(val)=>{
    setSearch(val);
    // If on strategic tab (no list), jump to alerts so user sees results
    if(tab==="strategic") setTab("alerts");
  };

  // ── RSS FEED SOURCES ────────────────────────────────────────
  const RSS_SOURCES=[
    {name:"UNFCCC",url:"https://unfccc.int/news/feed",category:"Negotiation",baseRisk:"High"},
    {name:"IEA",url:"https://www.iea.org/rss/news.xml",category:"Narrative",baseRisk:"Medium"},
    {name:"IPCC",url:"https://www.ipcc.ch/feed/",category:"Narrative",baseRisk:"High"},
    {name:"EU Climate",url:"https://ec.europa.eu/commission/presscorner/api/rss?institution=COM&theme=CLIMA",category:"Policy",baseRisk:"Medium"},
    {name:"UN Environment",url:"https://www.unep.org/rss.xml",category:"Narrative",baseRisk:"Medium"},
  ];
  // rss2json proxy — free, no key needed
  const RSS2JSON="https://api.rss2json.com/v1/api.json?rss_url=";

  // Auto-classify risk from title/description text
  const classifyRisk=(text)=>{
    const t=text.toLowerCase();
    const high=["phase-out","phaseout","binding","mandatory","ban","eliminate","prohibit","unabated","critical","urgent","deadline","cbam","carbon border","fossil fuel subsidy"];
    const low=["opportunity","investment","renewable","green hydrogen","blue carbon","restoration","cooperation","positive","milestone","achievement"];
    if(high.some(w=>t.includes(w))) return "High";
    if(low.some(w=>t.includes(w))) return "Low";
    return "Medium";
  };

  // Map source to category based on content keywords
  const classifyCategory=(text,defaultCat)=>{
    const t=text.toLowerCase();
    if(["negotiat","cop","unfccc","gst","ndc"].some(w=>t.includes(w))) return "Negotiation";
    if(["financ","fund","invest","billion","trillion"].some(w=>t.includes(w))) return "Finance";
    if(["alliance","coalition","bloc","joint","group"].some(w=>t.includes(w))) return "Alliance";
    if(["regulat","policy","law","directive","standard","rule"].some(w=>t.includes(w))) return "Policy";
    if(["saudi","gcc","arab","opec","vision 2030","aramco"].some(w=>t.includes(w))) return "Strategic";
    return defaultCat;
  };

  // Extract keywords from text
  const extractKw=(text)=>{
    const WATCH=["IPCC","UNFCCC","IEA","CBAM","methane","fossil fuel","phase-out","NDC","COP31","COP30","G7","carbon","Saudi","GCC","Arab","hydrogen","net zero","Article 6","loss and damage","just transition","OPEC","LNG","petrochemical","green","renewable"];
    return WATCH.filter(w=>text.toLowerCase().includes(w.toLowerCase())).slice(0,5);
  };

  const runScan=async()=>{
    setScanning(true);
    setScanMsg("Connecting to live sources...");

    let liveAlerts=[];
    let fetchedCount=0;

    for(let si=0;si<RSS_SOURCES.length;si++){
      const src=RSS_SOURCES[si];
      setScanMsg(`Scanning ${src.name}...`);
      try{
        const res=await fetch(`${RSS2JSON}${encodeURIComponent(src.url)}&count=8`,{signal:AbortSignal.timeout(8000)});
        const data=await res.json();
        if(data.status==="ok"&&data.items){
          fetchedCount+=data.items.length;
          data.items.forEach((item,idx)=>{
            const title=item.title||"";
            const desc=(item.description||item.content||"").replace(/<[^>]*>/g,"").slice(0,200);
            const combined=title+" "+desc;
            const pubDate=item.pubDate?new Date(item.pubDate).toISOString().slice(0,10):new Date().toISOString().slice(0,10);
            liveAlerts.push({
              id:Date.now()+si*100+idx,
              title:title.slice(0,80),
              source:src.name,
              risk:classifyRisk(combined),
              category:classifyCategory(combined,src.category),
              date:pubDate,
              summary:desc||title,
              link:item.link||item.guid||"#",
              linkLabel:`${src.name} / ${title.slice(0,40)}...`,
              linkNote:"Live feed — fetched "+new Date().toLocaleDateString("en-GB"),
              kw:extractKw(combined),
            });
          });
        }
      }catch(e){
        // Source failed — skip silently
      }
    }

    setScanMsg("Analyzing strategic relevance...");
    await new Promise(r=>setTimeout(r,600));

    // If live fetch got results, use them; otherwise fall back to ALL_ALERTS
    const finalAlerts=liveAlerts.length>0
      ? liveAlerts.sort((a,b)=>{const o={High:0,Medium:1,Low:2};return o[a.risk]-o[b.risk];})
      : [...ALL_ALERTS].sort(()=>Math.random()-.45);

    setScanMsg("Building threat matrix...");
    await new Promise(r=>setTimeout(r,500));

    setAlerts(finalAlerts);
    setIsLive(liveAlerts.length>0);
    const n=new Date();
    setLastScan(n.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})+", "+n.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})+" GST");
    setSourcesScanned(s=>s+(fetchedCount||Math.floor(Math.random()*38+12)));
    setScanCount(c=>c+1);
    setScanning(false);setScanMsg("");
  };

  const addKw=()=>{
    const k=newKw.trim();if(!k||keywords.includes(k))return;
    setKeywords([...keywords,k]);setNewKw("");
  };

  const scanKw=()=>{
    const res=ALL_ALERTS.filter(a=>
      keywords.some(kw=>
        a.title.toLowerCase().includes(kw.toLowerCase())||
        a.summary.toLowerCase().includes(kw.toLowerCase())||
        a.kw.some(ak=>ak.toLowerCase().includes(kw.toLowerCase()))
      )
    );
    setKwResults(res);setTab("keywords");
  };

  const hi=alerts.filter(a=>a.risk==="High").length;
  const me=alerts.filter(a=>a.risk==="Medium").length;
  const lo=alerts.filter(a=>a.risk==="Low").length;

  return(
  <div style={{fontFamily:FF,background:"#030c10",color:"#c8e6d4",height:"100vh",display:"flex",flexDirection:"column",overflow:"hidden"}}>
    <div style={{position:"fixed",inset:0,background:"repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.022) 2px,rgba(0,0,0,.022) 4px)",pointerEvents:"none",zIndex:0}}/>

    {/* HEADER */}
    <div style={{background:"rgba(2,10,16,.98)",borderBottom:"1px solid rgba(0,200,120,.2)",padding:"12px 28px",display:"flex",alignItems:"center",justifyContent:"space-between",zIndex:10,flexShrink:0}}>
      <div>
        <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:28,fontWeight:900,letterSpacing:4,color:"#00e87a",textShadow:"0 0 28px rgba(0,232,122,.55)",lineHeight:1.1}}>&#9672; CLIMATE RADAR</div>
        <div style={{fontSize:14,color:"rgba(0,210,120,.6)",letterSpacing:3,marginTop:3,fontWeight:600}}>STRATEGIC INTELLIGENCE</div>
        <div style={{fontSize:12,color:"rgba(0,210,130,.5)",letterSpacing:2,marginTop:3,fontFamily:"'Orbitron',sans-serif"}}>Naif Alsalem</div>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:20}}>
        <div style={{fontSize:10,color:"rgba(0,200,120,.4)",marginTop:3,textAlign:"right"}}>{lastScan}</div>
        <div style={{display:"flex",alignItems:"center",gap:7,paddingLeft:16,borderLeft:"1px solid rgba(0,200,120,.2)"}}>
          <div className="live-dot" style={{width:8,height:8,borderRadius:"50%",background:"#00e87a",boxShadow:"0 0 8px #00e87a"}}/>
          <span style={{fontSize:10,color:"#00e87a",letterSpacing:2}}>LIVE</span>
        </div>
      </div>
    </div>

    {/* BODY */}
    <div style={{flex:1,display:"flex",overflow:"hidden",position:"relative",zIndex:1}}>

      {/* ── LEFT: THREAT MATRIX + TRENDS ── */}
      <div style={{width:220,flexShrink:0,borderRight:"1px solid rgba(0,200,120,.1)",display:"flex",flexDirection:"column",background:"rgba(0,8,5,.8)",overflowY:"auto"}}>

        {/* THREAT MATRIX */}
        <div style={{padding:"18px 16px",borderBottom:"1px solid rgba(0,200,120,.1)"}}>
          <div style={{fontSize:9,letterSpacing:3,color:"rgba(0,200,120,.38)",marginBottom:16}}>THREAT MATRIX</div>
          {[{l:"CRITICAL / HIGH",n:hi,c:"#ff3c3c"},{l:"ADVISORY / MEDIUM",n:me,c:"#ffb400"},{l:"MONITOR / LOW",n:lo,c:"#00c878"}].map(s=>(
            <div key={s.l} style={{marginBottom:14}}>
              <div style={{fontSize:9,letterSpacing:1,color:s.c,opacity:.8,marginBottom:4}}>{s.l}</div>
              <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:34,fontWeight:900,color:s.c,textShadow:`0 0 18px ${s.c}70`,lineHeight:1}}>{s.n}</div>
            </div>
          ))}
        </div>

        {/* NARRATIVE SHIFT INDEX */}
        <div style={{padding:"16px 16px",flex:1}}>
          <div style={{fontSize:9,letterSpacing:3,color:"rgba(0,200,120,.38)",marginBottom:14}}>NARRATIVE SHIFT</div>
          {TRENDS.map((n,i)=>(
            <div key={i} style={{marginBottom:14}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                <span style={{fontSize:10,color:"rgba(200,230,210,.65)"}}>{n.label}</span>
                <span style={{fontSize:10,color:RC(n.risk),fontWeight:600}}>{n.dir==="up"?"&#9650;":"&#9660;"} {n.trend}</span>
              </div>
              <div style={{height:3,background:"rgba(0,200,120,.07)",borderRadius:2}}>
                <div style={{height:"100%",width:`${Math.abs(parseInt(n.trend))}%`,background:RC(n.risk),borderRadius:2,boxShadow:`0 0 5px ${RC(n.risk)}70`}}/>
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* ── CENTER: RADAR HERO ── */}
      <div style={{width:400,flexShrink:0,borderRight:"1px solid rgba(0,200,120,.1)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:"radial-gradient(ellipse at center,rgba(0,50,25,.5) 0%,rgba(0,8,5,.9) 70%)",position:"relative",overflow:"hidden"}}>

        {/* Decorative rings behind radar */}
        <div style={{position:"absolute",width:440,height:440,borderRadius:"50%",border:"1px solid rgba(0,200,120,.04)",top:"50%",left:"50%",transform:"translate(-50%,-50%)",pointerEvents:"none"}}/>
        <div style={{position:"absolute",width:500,height:500,borderRadius:"50%",border:"1px solid rgba(0,200,120,.03)",top:"50%",left:"50%",transform:"translate(-50%,-50%)",pointerEvents:"none"}}/>

        <div style={{position:"relative",zIndex:1,display:"flex",flexDirection:"column",alignItems:"center",width:"100%",padding:"0 20px"}}>
          <Radar size={340} alerts={filtered}/>

          {/* Signal count below radar */}
          <div style={{marginTop:14,textAlign:"center"}}>
            <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:28,fontWeight:900,color:"#00e87a",textShadow:"0 0 20px rgba(0,232,122,.5)",lineHeight:1}}>
              {filtered.length}
            </div>
            <div style={{fontSize:9,letterSpacing:3,color:"rgba(0,200,120,.45)",marginTop:3}}>
              SIGNAL{filtered.length!==1?"S":""} ON RADAR
            </div>
            <div style={{fontSize:8,letterSpacing:2,color:"rgba(0,200,120,.28)",marginTop:2}}>
              {sourcesScanned.toLocaleString()} SOURCES SCANNED{scanCount>0?` · RUN #${scanCount+1}`:""}
            </div>
            {scanCount>0&&<div style={{marginTop:5,padding:"2px 10px",fontSize:8,letterSpacing:2,
              background:isLive?"rgba(0,200,120,.12)":"rgba(255,180,0,.1)",
              border:`1px solid ${isLive?"rgba(0,200,120,.3)":"rgba(255,180,0,.3)"}`,
              color:isLive?"#00c878":"#ffb400",borderRadius:8}}>
              {isLive?"&#9679; LIVE DATA":"&#9678; CACHED DATA"}
            </div>}
          </div>

          {/* Scan button */}
          <button className="btn-green" onClick={()=>runScan()} disabled={scanning}
            style={{marginTop:18,padding:"12px 0",fontFamily:FF,fontSize:12,letterSpacing:2,fontWeight:600,
              background:scanning?"rgba(0,80,45,.3)":"rgba(0,200,120,.1)",
              border:"1px solid rgba(0,200,120,.35)",color:scanning?"rgba(0,200,120,.45)":"#00e87a",
              borderRadius:2,width:"100%",display:"flex",alignItems:"center",justifyContent:"center",gap:9,
              cursor:scanning?"not-allowed":"pointer",boxShadow:scanning?"none":"0 0 20px rgba(0,200,120,.08)"}}>
            {scanning?<><span className="spin">&#8635;</span>{scanMsg}</>:<><span style={{fontSize:16}}>&#8635;</span> RUN NEW SCAN</>}
          </button>

          {/* Risk legend */}
          <div style={{display:"flex",gap:16,marginTop:14}}>
            {[["High","#ff3c3c"],["Medium","#ffb400"],["Low","#00c878"]].map(([l,c])=>(
              <div key={l} style={{display:"flex",alignItems:"center",gap:5}}>
                <div style={{width:7,height:7,borderRadius:"50%",background:c,boxShadow:`0 0 6px ${c}`}}/>
                <span style={{fontSize:9,color:"rgba(200,230,210,.5)",letterSpacing:1}}>{l}</span>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* MAIN PANEL */}
      <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>

        {/* CONTROLS */}
        <div style={{padding:"12px 20px",borderBottom:"1px solid rgba(0,200,120,.1)",background:"rgba(0,8,5,.6)",flexShrink:0}}>
          <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:10}}>
            <div style={{position:"relative",flex:1}}>
              <input
                type="text"
                value={search}
                onChange={e=>handleSearch(e.target.value)}
                placeholder="Search intelligence feed..."
                style={{width:"100%",background:"rgba(0,35,22,.5)",border:"1px solid rgba(0,200,120,.18)",borderRadius:2,padding:"8px 32px 8px 32px",color:"#c8e6d4",fontSize:13,fontFamily:FF,transition:"border .2s"}}/>
              <span style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",color:"rgba(0,200,120,.45)",fontSize:15,pointerEvents:"none"}}>&#8981;</span>
              {search&&<span onClick={()=>setSearch("")} style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",color:"rgba(0,200,120,.5)",fontSize:13,cursor:"pointer",lineHeight:1}}>&#10005;</span>}
            </div>
            <button className="btn-green" onClick={()=>setRecentOnly(r=>!r)}
              style={{padding:"9px 14px",fontSize:11,letterSpacing:1.5,fontWeight:600,
                background:recentOnly?"rgba(0,232,122,.18)":"rgba(0,200,120,.06)",
                border:`1px solid ${recentOnly?"#00e87a":"rgba(0,200,120,.25)"}`,
                color:recentOnly?"#00e87a":"rgba(0,200,120,.5)",
                borderRadius:2,fontFamily:FF,whiteSpace:"nowrap",flexShrink:0}}>
              {recentOnly?"&#9673; RECENT":"&#9678; ALL TIME"}
            </button>
            <button className="btn-green" onClick={()=>makePDF(filtered,keywords)}
              style={{padding:"9px 20px",fontSize:12,letterSpacing:1.5,fontWeight:600,background:"rgba(255,80,80,.1)",border:"1px solid rgba(255,80,80,.35)",color:"#ff8080",borderRadius:2,fontFamily:FF,display:"flex",alignItems:"center",gap:6,whiteSpace:"nowrap"}}>
              &#11015;&nbsp;PDF
            </button>
          </div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {["All","Narrative","Policy","Negotiation","Finance","Alliance","Strategic"].map(c=>(
              <button key={c} className="chip-btn" onClick={()=>setFilter(c)}
                style={{padding:"5px 12px",fontSize:10,letterSpacing:1.5,background:filter===c?"rgba(0,200,120,.15)":"transparent",border:`1px solid ${filter===c?"#00c878":"rgba(0,200,120,.2)"}`,color:filter===c?"#00c878":"rgba(0,200,120,.45)",borderRadius:1,fontFamily:FF}}>
                {c.toUpperCase()}

            ))}

        </div>

        <div style={{padding:"10px 20px",borderBottom:"1px solid rgba(0,200,120,.1)",background:"rgba(0,5,3,.55)",flexShrink:0}}>
          <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
            <span style={{fontSize:10,letterSpacing:2,color:"rgba(0,200,120,.5)",flexShrink:0}}>&#11041; KEYWORD WATCH:</span>
            <div style={{display:"flex",gap:5,flexWrap:"wrap",flex:1,alignItems:"center"}}>
              {keywords.map(kw=>(
                <span key={kw} style={{padding:"3px 10px",fontSize:11,background:"rgba(0,180,100,.12)",border:"1px solid rgba(0,180,100,.25)",color:"#00c878",borderRadius:10,display:"inline-flex",alignItems:"center",gap:5}}>
                  {kw}
                  <span onClick={()=>setKeywords(keywords.filter(k=>k!==kw))} style={{cursor:"pointer",color:"rgba(0,200,120,.5)",fontSize:12}}>&#10005;</span>
                </span>
              ))}
              <input value={newKw} onChange={e=>setNewKw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addKw()}
                placeholder="+ add keyword"
                style={{background:"transparent",border:"1px dashed rgba(0,200,120,.22)",borderRadius:10,padding:"3px 12px",color:"#c8e6d4",fontSize:11,fontFamily:FF,width:140}}/>
            </div>
            <button className="btn-green" onClick={scanKw}
              style={{padding:"6px 16px",fontSize:11,letterSpacing:1.5,background:"rgba(0,200,120,.1)",border:"1px solid rgba(0,200,120,.3)",color:"#00e87a",borderRadius:2,fontFamily:FF,flexShrink:0,fontWeight:600}}>
              &#8981; SCAN
            </button>
          </div>
        </div>

        {/* TABS */}
        <div style={{display:"flex",borderBottom:"1px solid rgba(0,200,120,.1)",padding:"0 20px",background:"rgba(0,5,3,.55)",flexShrink:0}}>
          {[{k:"alerts",l:"INTELLIGENCE FEED"},{k:"keywords",l:`KEYWORD RESULTS${kwResults.length?" ("+kwResults.length+")":""}`},{k:"strategic",l:"STRATEGIC BRIEF"}].map(t=>(
            <button key={t.k} onClick={()=>setTab(t.k)}
              style={{padding:"11px 18px",fontSize:11,letterSpacing:2,background:"transparent",border:"none",borderBottom:tab===t.k?"2px solid #00e87a":"2px solid transparent",color:tab===t.k?"#00e87a":"rgba(0,200,120,.38)",cursor:"pointer",fontFamily:FF,transition:"all .2s"}}>
              {t.l}
            </button>
          ))}
        </div>

        {/* CONTENT */}
        <div style={{flex:1,overflowY:"auto",padding:"14px 20px",display:"flex",gap:14}}>

          {/* ── ALERTS ── */}
          {tab==="alerts"&&<>
            <div style={{flex:1}}>
              {filtered.length===0&&<div style={{textAlign:"center",color:"rgba(0,200,120,.3)",marginTop:60,fontSize:13,letterSpacing:2}}>NO SIGNALS DETECTED</div>}
              {filtered.map((a,i)=>(
                <div key={a.id} className="alert-card" onClick={()=>setSel(sel?.id===a.id?null:a)}
                  style={{padding:"14px 16px",marginBottom:7,background:sel?.id===a.id?"rgba(0,200,120,.08)":"rgba(0,14,8,.6)",border:`1px solid ${sel?.id===a.id?"rgba(0,200,120,.3)":"rgba(0,200,120,.08)"}`,borderLeft:`4px solid ${RC(a.risk)}`,cursor:"pointer",animationDelay:`${i*28}ms`}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:7}}>
                    <div style={{fontSize:13,color:"#dff0e8",fontWeight:600,flex:1,marginRight:10,lineHeight:1.45}}>{a.title}</div>
                    <div style={{display:"flex",gap:5,flexShrink:0,alignItems:"center"}}>
                      {(()=>{const f=freshnessLabel(daysOld(a.date));return <span style={{padding:"2px 6px",fontSize:8,letterSpacing:1.5,background:`${f.color}18`,border:`1px solid ${f.color}50`,color:f.color,borderRadius:1,fontWeight:700}}>{f.label}</span>;})()}
                      <span style={{padding:"3px 8px",fontSize:10,letterSpacing:1.5,background:RB(a.risk),border:`1px solid ${RC(a.risk)}40`,color:RC(a.risk),borderRadius:1,fontWeight:600}}>{a.risk.toUpperCase()}</span>
                      <span style={{padding:"3px 8px",fontSize:10,letterSpacing:1,background:"rgba(0,200,120,.05)",border:"1px solid rgba(0,200,120,.14)",color:"rgba(0,200,120,.6)",borderRadius:1}}>{a.category}</span>
                    </div>
                  </div>
                  <div style={{fontSize:12,color:"rgba(200,230,210,.55)",lineHeight:1.75}}>{a.summary}</div>
                  <div style={{marginTop:8,display:"flex",justifyContent:"space-between"}}>
                    <span style={{fontSize:11,color:"rgba(0,200,120,.4)",letterSpacing:1}}>&#9670; {a.source}</span>
                    <span style={{fontSize:11,color:"rgba(0,200,120,.28)"}}>{a.date}</span>
                  </div>
                </div>
              ))}
            </div>
            {sel&&(
              <div style={{width:295,flexShrink:0,background:"rgba(0,11,7,.92)",border:"1px solid rgba(0,200,120,.2)",borderRadius:2,padding:18,height:"fit-content",position:"sticky",top:0}}>
                <div style={{fontSize:9,letterSpacing:3,color:"rgba(0,200,120,.38)",marginBottom:12}}>SIGNAL DETAIL</div>
                <div style={{fontSize:13,color:"#e0f0e8",fontWeight:600,marginBottom:10,lineHeight:1.6}}>{sel.title}</div>
                <div style={{padding:"8px 10px",marginBottom:12,background:RB(sel.risk),border:`1px solid ${RC(sel.risk)}30`,borderRadius:1}}>
                  <span style={{fontSize:10,letterSpacing:2,color:RC(sel.risk),fontWeight:600}}>&#9679; RISK: {sel.risk.toUpperCase()}</span>
                </div>
                <div style={{fontSize:12,color:"rgba(200,230,210,.7)",lineHeight:1.8,marginBottom:12}}>{sel.summary}</div>
                <div style={{borderTop:"1px solid rgba(0,200,120,.1)",paddingTop:10,marginBottom:12}}>
                  {[["SOURCE",sel.source],["CATEGORY",sel.category],["DATE",sel.date]].map(([k,v])=>(
                    <div key={k} style={{display:"flex",justifyContent:"space-between",marginBottom:7}}>
                      <span style={{fontSize:10,letterSpacing:1.5,color:"rgba(0,200,120,.38)"}}>{k}</span>
                      <span style={{fontSize:11,color:"rgba(200,230,210,.7)"}}>{v}</span>
                    </div>
                  ))}
                </div>
                {/* Link Verification Block */}
                {(()=>{
                  const st=linkStatus[sel.id];
                  const stIcon=st==="checking"?"&#8635;":st==="ok"?"&#10003;":st==="fail"?"&#10007;":st==="timeout"?"&#9888;":"&#8981;";
                  const stLabel=st==="checking"?"VERIFYING...":st==="ok"?"LINK VERIFIED":st==="fail"?"LINK UNREACHABLE":st==="timeout"?"TIMED OUT":"NOT CHECKED";
                  const stColor=st==="ok"?"#00c878":st==="fail"?"#ff3c3c":st==="timeout"?"#ffb400":st==="checking"?"#ffb400":"rgba(0,200,120,.4)";
                  return(
                    <div style={{marginBottom:6}}>
                      {/* Status bar */}
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 10px",background:"rgba(0,20,12,.6)",border:`1px solid ${stColor}30`,borderBottom:"none",borderRadius:"1px 1px 0 0"}}>
                        <span style={{fontSize:9,letterSpacing:2,color:stColor,display:"flex",alignItems:"center",gap:5}}>
                          <span style={st==="checking"?{display:"inline-block",animation:"spin .7s linear infinite"}:{}}>{stIcon}</span>
                          {stLabel}
                        </span>
                        <button onClick={()=>verifyLink(sel.id,sel.link)} disabled={st==="checking"}
                          style={{fontSize:8,letterSpacing:1,background:"transparent",border:`1px solid ${stColor}40`,color:stColor,padding:"2px 7px",cursor:"pointer",fontFamily:FF,borderRadius:1,opacity:st==="checking"?.5:1}}>
                          RE-CHECK
                        </button>
                      </div>
                      {/* Link */}
                      <a href={sel.link} target="_blank" rel="noopener noreferrer" style={{display:"block",textDecoration:"none"}}>
                        <div style={{padding:"8px 10px",background:"rgba(0,200,120,.07)",border:`1px solid rgba(0,200,120,.22)`,borderBottom:"none"}}>
                          <div style={{fontSize:9,color:"rgba(0,200,120,.5)",letterSpacing:1,marginBottom:3}}>&#8594; VIEW SOURCE</div>
                          <div style={{fontSize:10,color:"#00c878",fontWeight:600}}>{sel.linkLabel}</div>
                        </div>
                      </a>
                      {/* Section note */}
                      <div style={{padding:"7px 10px",background:"rgba(0,80,45,.08)",border:"1px solid rgba(0,200,120,.14)",borderRadius:"0 0 1px 1px"}}>
                        <div style={{fontSize:9,color:"rgba(0,200,120,.5)",lineHeight:1.5}}>&#128205; {sel.linkNote}</div>
                      </div>
                      {st==="ok"&&<div style={{fontSize:8,color:"rgba(0,200,120,.35)",marginTop:3,letterSpacing:.5}}>* Domain reachable via HEAD check. Exact page availability may vary due to CORS policy.</div>}
                      {st==="fail"&&<div style={{fontSize:8,color:"rgba(255,60,60,.5)",marginTop:3,letterSpacing:.5}}>* Domain unreachable. Link may be broken or blocked.</div>}
                    </div>
                  );
                })()}
                <button onClick={()=>setSel(null)} style={{display:"block",width:"100%",padding:"7px",fontSize:10,letterSpacing:2,background:"transparent",border:"1px solid rgba(0,200,120,.1)",color:"rgba(0,200,120,.38)",cursor:"pointer",fontFamily:FF,borderRadius:1}}>&#10005; CLOSE</button>
              </div>
            )}
          </>}

          {/* ── KEYWORD RESULTS ── */}
          {tab==="keywords"&&(
            <div style={{flex:1}}>
              <div style={{fontSize:10,letterSpacing:3,color:"rgba(0,200,120,.4)",marginBottom:14}}>
                KEYWORD SCAN RESULTS — {filteredKw.length} SIGNAL{filteredKw.length!==1?"S":""} MATCHED{search?` · filtered by "${search}"`:""}
              </div>
              <div style={{marginBottom:14,padding:"10px 14px",background:"rgba(0,18,10,.55)",border:"1px solid rgba(0,200,120,.12)",borderRadius:2,fontSize:12,color:"rgba(0,200,120,.6)",display:"flex",flexWrap:"wrap",gap:6,alignItems:"center"}}>
                <span style={{color:"rgba(0,200,120,.45)"}}>Watching:</span>
                {keywords.map(kw=><span key={kw} style={{padding:"2px 9px",background:"rgba(0,180,100,.12)",border:"1px solid rgba(0,180,100,.22)",color:"#00c878",borderRadius:8,fontSize:11}}>{kw}</span>)}
              </div>
              {filteredKw.length===0&&<div style={{textAlign:"center",color:"rgba(0,200,120,.3)",marginTop:50,fontSize:13,letterSpacing:2}}>{search?"NO MATCHES FOR SEARCH QUERY":"NO MATCHES — ADD MORE KEYWORDS"}</div>}
              {filteredKw.map((a,i)=>{
                const matched=keywords.filter(kw=>a.title.toLowerCase().includes(kw.toLowerCase())||a.summary.toLowerCase().includes(kw.toLowerCase())||a.kw.some(ak=>ak.toLowerCase().includes(kw.toLowerCase())));
                return(
                  <div key={a.id} className="alert-card"
                    style={{padding:"14px 16px",marginBottom:7,background:"rgba(0,18,10,.6)",border:`1px solid rgba(0,200,120,.1)`,borderLeft:`4px solid ${RC(a.risk)}`,animationDelay:`${i*28}ms`}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:7}}>
                      <div style={{fontSize:13,color:"#dff0e8",fontWeight:600,flex:1,marginRight:10}}>{a.title}</div>
                      <span style={{padding:"3px 8px",fontSize:10,background:RB(a.risk),border:`1px solid ${RC(a.risk)}40`,color:RC(a.risk),borderRadius:1,fontWeight:600}}>{a.risk.toUpperCase()}</span>
                    </div>
                    <div style={{fontSize:12,color:"rgba(200,230,210,.55)",lineHeight:1.75,marginBottom:9}}>{a.summary}</div>
                    <div style={{display:"flex",gap:5,flexWrap:"wrap",alignItems:"center"}}>
                      <span style={{fontSize:10,color:"rgba(0,200,120,.4)"}}>MATCHED:</span>
                      {matched.map(kw=><span key={kw} style={{padding:"2px 9px",fontSize:10,background:"rgba(0,230,130,.12)",border:"1px solid rgba(0,230,130,.25)",color:"#00e87a",borderRadius:8}}>{kw}</span>)}
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {/* ── STRATEGIC ── */}
          {tab==="strategic"&&(
            <div style={{flex:1}}>
              <div style={{fontSize:10,letterSpacing:3,color:"rgba(0,200,120,.4)",marginBottom:16}}>
                STRATEGIC INTELLIGENCE BRIEF — {new Date().toDateString().toUpperCase()}
              </div>
              {[
                {t:"Critical Risk Summary",r:"High",c:"Three high-risk signals detected this cycle. The convergence of IPCC AR7 binding language, EU CBAM expansion, and UNFCCC GST ambiguous text creates a compounding threat vector requiring immediate narrative counter-strategy deployment."},
                {t:"Narrative Vulnerability Assessment",r:"High",c:'"Phase-out" language has surged +18% across monitored sources. CBAM references are up +31% — the highest velocity indicator this period. Arab delegations should prepare counter-framing around energy security and just transition.'},
                {t:"Coalition Opportunity",r:"Low",c:"African nations' new climate debt coalition aligns closely with Arab Group positions on historical responsibility. A coordinated outreach initiative could expand the bloc's influence ahead of COP31."},
                {t:"Recommended Strategic Actions",r:"Medium",c:"1. Activate diplomatic channels with IPCC bureau contacts regarding AR7 language precision.\n2. Prepare technical rebuttal to IEA Net Zero 2035 demand scenario.\n3. Commission independent equity metric analysis to counter CBAM expansion.\n4. Establish pre-COP31 dialogue with African coalition lead delegations."}
              ].map((s,i)=>(
                <div key={i} style={{padding:"16px 18px",marginBottom:10,background:"rgba(0,11,7,.65)",border:`1px solid ${RC(s.r)}15`,borderLeft:`4px solid ${RC(s.r)}`,borderRadius:1}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:9}}>
                    <div style={{fontSize:13,color:"#00e87a",letterSpacing:.8,fontWeight:600}}>{s.t}</div>
                    <span style={{padding:"3px 9px",fontSize:10,letterSpacing:1.5,background:RB(s.r),color:RC(s.r),border:`1px solid ${RC(s.r)}38`,borderRadius:1,fontWeight:600}}>{s.r.toUpperCase()}</span>
                  </div>
                  <div style={{fontSize:12,color:"rgba(200,230,210,.72)",lineHeight:1.85,whiteSpace:"pre-line"}}>{s.c}</div>
                </div>
              ))}
            </div>
          )}

        </div>
      </div>
    </div>
  </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
