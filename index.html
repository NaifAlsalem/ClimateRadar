async function sha256(s){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
}

const freshness=d=>{
  if(d<=1)  return{label:'TODAY',color:'#00ff99'};
  if(d<=7)  return{label:'NEW',  color:'#00e87a'};
  if(d<=30) return{label:d+'D',  color:'#00c878'};
  if(d<=90) return{label:d+'D',  color:'#ffaa00'};

};

const autoRisk=text=>{
  const t=text.toLowerCase();
  if(['phase-out','phaseout','binding','mandatory','cbam','carbon border','unabated','ban fossil'].some(w=>t.includes(w)))return'High';
  if(['opportunity','renewable','green hydrogen','blue carbon','cooperation','achievement'].some(w=>t.includes(w)))return'Low';
  return'Medium';
};
const autoCat=(text,def)=>{
  const t=text.toLowerCase();
  if(['negotiat','cop ','unfccc','gst','ndc'].some(w=>t.includes(w)))return'Negotiation';

const TREND_CFG=[
  {label:'Phase-out Language', keys:['phase-out','phaseout','phase out','fossil fuel phase'],risk:'High'},
  {label:'CBAM / Carbon Border',keys:['cbam','carbon border','carbon border adjustment'],risk:'High'},
  {label:'Net Zero Pressure',  keys:['net zero','netzero','carbon neutral','1.5 degrees'],risk:'High'},
  {label:'Fossil Fuel Finance', keys:['fossil fuel finance','divest','end fossil','fossil subsidy'],risk:'High'},
  {label:'Just Transition',    keys:['just transition','equity','fair share','historical responsibility'],risk:'Medium'},
  {label:'Adaptation Finance', keys:['adaptation finance','loss and damage','resilience fund'],risk:'Medium'},
  {label:'Carbon Markets',     keys:['carbon market','article 6','voluntary carbon','carbon credit'],risk:'Low'},
  {label:'Energy Security',    keys:['energy security','oil demand','gas supply','LNG'],risk:'Low'},
];
const computeTrends=(curr,prev)=>TREND_CFG.map(t=>{
  const count=alerts=>{
    const corpus=alerts.map(a=>(a.title+' '+a.summary).toLowerCase()).join(' ');
    return t.keys.reduce((s,k)=>{const m=corpus.match(new RegExp(k,'g'));return s+(m?m.length:0);},0);
  };
  const c=count(curr),p=count(prev);
  let pct=0,dir='flat';
  if(p===0&&c>0){pct=Math.min(c*10,99);dir='up';}
  else if(p>0){pct=Math.round(((c-p)/p)*100);dir=pct>0?'up':pct<0?'down':'flat';}
  const abs=Math.min(Math.abs(pct),99);
  const dynRisk=abs>20?'High':abs>5?'Medium':'Low';
  return{...t,pct:abs,dir,display:(dir==='up'?'+':dir==='down'?'-':'')+abs+'%',dynRisk};
}).sort((a,b)=>b.pct-a.pct);

const fetchFeed=async src=>{
  const parseXML=xml=>{
    const doc=new DOMParser().parseFromString(xml,'text/xml');
    return[...doc.querySelectorAll('item,entry')].map(el=>({
      title:(el.querySelector('title')?.textContent||'').trim(),
      description:(el.querySelector('description,summary,content')?.textContent||'').replace(/<[^>]*>/g,'').trim(),
      link:el.querySelector('link')?.textContent?.trim()||el.querySelector('link')?.getAttribute('href')||'',
      pubDate:el.querySelector('pubDate,published,updated')?.textContent||'',
    })).filter(i=>i.title.length>5);
  };
  const proxies=[
    async()=>{
      const r=await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(src.url));
      if(!r.ok)throw new Error('fail');
      return parseXML(await r.text());
    },
    async()=>{
      const r=await fetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(src.url)+'&count=50');
      const d=await r.json();
      if(d.status!=='ok'||!d.items?.length)throw new Error('fail');
      return d.items;
    },
    async()=>{
      const r=await fetch('https://corsproxy.io/?'+encodeURIComponent(src.url));
      if(!r.ok)throw new Error('fail');
      return parseXML(await r.text());
    },
    async()=>{
      const r=await fetch('https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(src.url));
      if(!r.ok)throw new Error('fail');
      return parseXML(await r.text());
    },
    async()=>{
      const r=await fetch('https://thingproxy.freeboard.io/fetch/'+encodeURIComponent(src.url));
      if(!r.ok)throw new Error('fail');
      return parseXML(await r.text());
    },
  ];
  for(const proxy of proxies){
    try{
      const ctrl=new AbortController();
      const t=setTimeout(()=>ctrl.abort(),8000);
      const items=await proxy();
      clearTimeout(t);
      if(items&&items.length>0)return items;
    }catch(e){}
  }
  return[];
};

/* RADAR CANVAS */
const Radar=({alerts,size=300})=>{
  const ref=useRef(null);
  const liveRef=useRef(alerts);
  const trailsRef=useRef({});
  useEffect(()=>{
    const ids=new Set(alerts.map(a=>a.id));
    Object.keys(trailsRef.current).forEach(k=>{if(!ids.has(+k))delete trailsRef.current[k];});
    liveRef.current=alerts;
  },[alerts]);
  useEffect(()=>{
    const c=ref.current;if(!c)return;
    const ctx=c.getContext('2d');
    let ang=0,raf;
    const GA=2.39996;
    const rMap={High:.3,Medium:.58,Low:.82};
    const draw=()=>{
      const W=c.width,H=c.height,cx=W/2,cy=H/2,R=Math.min(W,H)/2-8;
      ctx.clearRect(0,0,W,H);
      const g=ctx.createRadialGradient(cx,cy,0,cx,cy,R);
      g.addColorStop(0,'rgba(0,60,35,.55)');g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fill();
      [.25,.5,.75,1].forEach(r=>{
        ctx.beginPath();ctx.arc(cx,cy,R*r,0,Math.PI*2);
        ctx.strokeStyle='rgba(0,200,140,'+(r===1?.22:.09)+')';ctx.lineWidth=r===1?1.2:.6;ctx.stroke();
      });
      for(let i=0;i<6;i++){
        const a=i*Math.PI/6;
        ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R);
        ctx.lineTo(cx-Math.cos(a)*R,cy-Math.sin(a)*R);
        ctx.strokeStyle='rgba(0,200,140,.06)';ctx.lineWidth=.5;ctx.stroke();
      }
      for(let i=0;i<80;i++){
        const sa=ang-(i*Math.PI)/120;
        ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,sa,sa+Math.PI/120);
        ctx.fillStyle='rgba(0,230,140,'+(1-i/80)*.22+')';ctx.fill();
      }
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(ang)*R,cy+Math.sin(ang)*R);
      ctx.strokeStyle='rgba(0,245,155,.9)';ctx.lineWidth=2;ctx.stroke();
      liveRef.current.forEach((a,i)=>{
        if(!trailsRef.current[a.id])trailsRef.current[a.id]=[];
        const tr=trailsRef.current[a.id];
        const bAng=(i*GA)%(Math.PI*2);
        const bRad=rMap[a.risk]||.58;
        const bx=cx+Math.cos(bAng)*R*bRad,by=cy+Math.sin(bAng)*R*bRad;
        const diff=((bAng-ang)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
        const fresh=diff<.35?1:diff>5.9?(6.28-diff)/.38:0;
        if(fresh>0)tr.push({x:bx,y:by,a:fresh});
        if(tr.length>12)tr.shift();
        const col=a.risk==='High'?'255,60,60':a.risk==='Medium'?'255,170,0':'0,200,120';
        tr.forEach((t,ti)=>{ctx.beginPath();ctx.arc(t.x,t.y,2.5,0,Math.PI*2);ctx.fillStyle='rgba('+col+','+(ti/tr.length)*t.a*.55+')';ctx.fill();});
        ctx.beginPath();ctx.arc(bx,by,4.5,0,Math.PI*2);ctx.fillStyle='rgba('+col+',.95)';ctx.fill();
        ctx.beginPath();ctx.arc(bx,by,9,0,Math.PI*2);ctx.strokeStyle='rgba('+col+',.2)';ctx.lineWidth=1;ctx.stroke();
      });
      ctx.beginPath();ctx.arc(cx,cy,4,0,Math.PI*2);ctx.fillStyle='rgba(0,245,155,.9)';ctx.fill();
      ang=(ang+.017)%(Math.PI*2);
      raf=requestAnimationFrame(draw);
    };
    draw();
    return()=>cancelAnimationFrame(raf);
  },[]);
  return React.createElement('canvas',{ref,width:size,height:size,style:{borderRadius:'50%',display:'block'}});
};

/* PDF */
const makePDF=(alerts,keywords,trends)=>{
  const{jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const W=doc.internal.pageSize.getWidth();
  let y=0;
  const np=()=>{if(y>268){doc.addPage();y=16;}};
  doc.setFillColor(2,11,10);doc.rect(0,0,W,32,'F');
  doc.setDrawColor(0,200,120);doc.setLineWidth(.4);doc.line(0,32,W,32);
  doc.setFontSize(18);doc.setTextColor(0,230,122);doc.setFont('helvetica','bold');
  doc.text('CLIMATE RADAR',14,14);
  doc.setFontSize(9);doc.setTextColor(0,180,100);doc.setFont('helvetica','normal');
  doc.text('Strategic Intelligence Report',14,22);
  doc.text('Prepared by: Naif Alsalem',14,28);
  doc.text('Generated: '+new Date().toLocaleString(),W-70,28);
  y=40;
  if(keywords.length){
    doc.setFontSize(8);doc.setTextColor(0,180,100);doc.setFont('helvetica','bold');
    doc.text('KEYWORD WATCH: '+keywords.join(' / '),14,y);y+=8;
  }
  const hi=alerts.filter(a=>a.risk==='High').length;
  const me=alerts.filter(a=>a.risk==='Medium').length;
  const lo=alerts.filter(a=>a.risk==='Low').length;
  doc.setFillColor(8,28,20);doc.rect(14,y-4,W-28,12,'F');
  doc.setFontSize(9);
  doc.setTextColor(0,200,120);doc.text('Total: '+alerts.length,16,y+4);
  doc.setTextColor(220,50,50);doc.text('High: '+hi,55,y+4);
  doc.setTextColor(220,160,0);doc.text('Medium: '+me,85,y+4);
  doc.setTextColor(0,180,100);doc.text('Low: '+lo,120,y+4);
  y+=18;
  if(trends.some(t=>t.pct>0)){
    doc.setFontSize(10);doc.setTextColor(0,220,130);doc.setFont('helvetica','bold');
    doc.text('NARRATIVE SHIFT INDEX',14,y);y+=7;
    trends.slice(0,8).forEach(t=>{
      np();
      const rc=t.dynRisk==='High'?[220,50,50]:t.dynRisk==='Medium'?[220,160,0]:[0,180,100];
      doc.setFontSize(8);doc.setFont('helvetica','normal');doc.setTextColor(...rc);
      doc.text((t.dir==='up'?'^':t.dir==='down'?'v':'-')+' '+t.label+': '+t.display,16,y);y+=5;
    });
    y+=4;
  }
  doc.setFontSize(11);doc.setTextColor(0,220,130);doc.setFont('helvetica','bold');
  doc.text('INTELLIGENCE FEED',14,y);y+=8;
  alerts.forEach((a,i)=>{
    np();
    const rc=a.risk==='High'?[200,40,40]:a.risk==='Medium'?[200,140,0]:[0,160,90];
    const bg=a.risk==='High'?[40,8,8]:a.risk==='Medium'?[40,28,4]:[4,28,16];
    doc.setFillColor(...bg);doc.rect(14,y-4,W-28,32,'F');
    doc.setFillColor(...rc);doc.rect(14,y-4,3,32,'F');
    doc.setFontSize(10);doc.setTextColor(220,240,230);doc.setFont('helvetica','bold');
    doc.text((i+1)+'. '+a.title.slice(0,80),20,y+2);
    doc.setFontSize(8);doc.setTextColor(...rc);
    doc.text('['+a.risk.toUpperCase()+'] '+a.category,W-48,y+2);
    doc.setFontSize(8);doc.setTextColor(160,200,180);doc.setFont('helvetica','normal');
    const lines=doc.splitTextToSize(a.summary.slice(0,300),W-38);
    doc.text(lines.slice(0,2),20,y+9);
    doc.setFontSize(7);doc.setTextColor(80,140,100);
    doc.text(a.source+'   '+a.date,20,y+24);
    if(a.link&&a.link!=='#'){doc.setTextColor(0,140,200);doc.textWithLink('Source ->',W-32,y+24,{url:a.link});}
    y+=36;np();
  });
  doc.setDrawColor(200,30,30);doc.setLineWidth(.6);doc.line(14,279,W-14,279);
  doc.setFontSize(8.5);doc.setTextColor(210,30,30);doc.setFont('helvetica','bold');
  doc.text('Strategic Intelligence | Naif Alsalem',14,284);
  doc.text('CONFIDENTIAL',W-32,284);
  doc.save('ClimateRadar_'+new Date().toISOString().slice(0,10)+'.pdf');
};

/* MAIN APP */
function App(){
  const[authed,setAuthed]=useState(!!sessionStorage.getItem('cr_ok'));
  const[pin,setPin]=useState('');
  const[pinErr,setPinErr]=useState('');

  const[alerts,setAlerts]=useState([]);
  const[prevAlerts,setPrevAlerts]=useState([]);
  const[trends,setTrends]=useState(TREND_CFG.map(t=>({...t,pct:0,dir:'flat',display:'--',dynRisk:t.risk})));
  const[filter,setFilter]=useState('All');
  const[search,setSearch]=useState('');
  const[tab,setTab]=useState('feed');
  const[sel,setSel]=useState(null);
  const[scanning,setScanning]=useState(false);
  const[scanMsg,setScanMsg]=useState('');
  const[scanCount,setScanCount]=useState(0);
  const[totalFetched,setTotalFetched]=useState(0);
  const[isLive,setIsLive]=useState(false);
  const[lastScan,setLastScan]=useState(()=>{const n=new Date();return n.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+' '+n.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})+' GST';});
  const[keywords,setKeywords]=useState(['fossil fuel','CBAM','phase-out']);
  const[newKw,setNewKw]=useState('');
  const[kwResults,setKwResults]=useState([]);
  const[linkSt,setLinkSt]=useState({});
  const[recentOnly,setRecentOnly]=useState(false);

  const doAuth=async()=>{
    const h=await sha256(pin.trim());
    if(h===HASH){sessionStorage.setItem('cr_ok','1');setAuthed(true);}
    else{setPinErr('Invalid code');setPin('');setTimeout(()=>setPinErr(''),2500);}
  };

  const filtered=alerts.filter(a=>
    (filter==='All'||a.category===filter)&&
    (!recentOnly||daysOld(a.date)<=90)&&
    (search===''||
      a.title.toLowerCase().includes(search.toLowerCase())||
      a.summary.toLowerCase().includes(search.toLowerCase()))
  );

  const hi=alerts.filter(a=>a.risk==='High').length;
  const me=alerts.filter(a=>a.risk==='Medium').length;
  const lo=alerts.filter(a=>a.risk==='Low').length;

  const runScan=async()=>{
    if(scanning)return;
    setScanning(true);setScanMsg('Initializing...');
    let live=[];let fetched=0;
    for(let i=0;i<RSS_SOURCES.length;i++){
      const src=RSS_SOURCES[i];
      setScanMsg('Scanning '+src.name+'...');
      try{
        const items=await fetchFeed(src);
        fetched+=items.length;
        items.forEach((item,idx)=>{
          const title=(item.title||'').slice(0,150);
          const desc=(item.description||'').replace(/<[^>]*>/g,'').slice(0,500);
          const combined=title+' '+desc;
          const pubDate=item.pubDate
            ?new Date(item.pubDate).toISOString().slice(0,10)
            :new Date().toISOString().slice(0,10);
          // Only include signals from the last 30 days
          const signalDate=new Date(pubDate);
          const cutoff=new Date();cutoff.setDate(cutoff.getDate()-30);
          if(signalDate>=cutoff){
            live.push({
              id:i*10000+idx+Math.floor(Math.random()*1000),
              title,source:src.name,
              risk:autoRisk(combined),
              category:autoCat(combined,src.cat),
              date:pubDate,
              summary:desc||title,
              link:item.link||'#',
              linkLabel:src.name,
              linkNote:'Live feed - fetched '+new Date().toLocaleDateString('en-GB'),
              kw:autoKw(combined),
            });
          }
        });
      }catch(e){}
    }
    setScanMsg('Analyzing...');
    await new Promise(r=>setTimeout(r,400));
    // If all proxies failed, use curated intelligence as fallback
    const source=live.length>0?live:CURATED;
    const final=source.sort((a,b)=>RISK_ORDER[a.risk]-RISK_ORDER[b.risk]);
    setAlerts(final);
    setTrends(computeTrends(final,prevAlerts));
    setPrevAlerts(final);
    setIsLive(live.length>0);
    setTotalFetched(n=>n+(fetched||CURATED.length));
    setScanCount(n=>n+1);
    const n=new Date();
    setLastScan(
      n.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+
      ' '+n.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})+' GST'
    );
    setScanning(false);setScanMsg('');
  };

  const addKw=()=>{
    const k=newKw.trim();
    if(k&&!keywords.includes(k)){setKeywords([...keywords,k]);setNewKw('');}
  };
  const doKwScan=()=>{
    const res=alerts.filter(a=>
      keywords.some(kw=>(a.title+' '+a.summary+(a.kw||[]).join(' ')).toLowerCase().includes(kw.toLowerCase()))
    );
    setKwResults(res);setTab('keywords');
  };

  const verifyLink=async(id,url)=>{
    if(!url||url==='#')return;
    setLinkSt(s=>({...s,[id]:'checking'}));
    try{
      const ctrl=new AbortController();
      setTimeout(()=>ctrl.abort(),7000);
      await fetch(url,{method:'HEAD',mode:'no-cors',signal:ctrl.signal});
      setLinkSt(s=>({...s,[id]:'ok'}));
    }catch(e){
      setLinkSt(s=>({...s,[id]:e.name==='AbortError'?'timeout':'fail'}));
    }
  };

      <div style={{height:16,fontSize:10,color:'#ff4040',marginBottom:8}}>{pinErr}</div>
      <button onClick={doAuth} className="btn"
        style={{padding:'9px 40px',background:'rgba(0,200,120,.1)',border:'1px solid rgba(0,200,120,.4)',
          color:'#00e87a',fontSize:11,letterSpacing:2,borderRadius:2}}>
        AUTHENTICATE
      </button>
      <div style={{position:'absolute',bottom:18,fontFamily:"Georgia, serif",fontSize:12,color:'rgba(220,50,50,.7)',letterSpacing:2}}>
        AUTHORIZED ACCESS ONLY - Naif Alsalem
      </div>
    </div>
  );

        <a href='https://github.com/NaifAlsalem/ClimateRadar' target='_blank' rel='noopener noreferrer'
          style={{fontSize:12,color:'rgba(0,230,130,.75)',letterSpacing:2,marginTop:4,fontWeight:700,textDecoration:'none',display:'inline-block',borderBottom:'1px solid rgba(0,200,120,.3)',paddingBottom:1}}>
          Naif Alsalem
        </a>
      </div>
      {/* CENTER — Negotiation Rapid Support */}
      <div style={{display:'flex',flexDirection:'column',alignItems:'center',flex:1}}>
        <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:26,fontWeight:900,letterSpacing:3,color:'rgba(0,255,160,.7)',textShadow:'0 0 16px rgba(0,255,160,.35)',textAlign:'center'}}>
          Negotiation Rapid Support

                        <div style={{display:'flex',gap:4,flexShrink:0,alignItems:'center',flexWrap:'wrap',justifyContent:'flex-end'}}>
                          <span style={{padding:'1px 6px',fontSize:8,background:f.color+'18',border:'1px solid '+f.color+'50',color:f.color,borderRadius:1,fontWeight:700}}>{f.label}</span>
                          <span style={{padding:'2px 7px',fontSize:9,background:RB(a.risk),border:'1px solid '+RC(a.risk)+'40',color:RC(a.risk),borderRadius:1,fontWeight:700}}>{a.risk.toUpperCase()}</span>
                          <span style={{padding:'2px 7px',fontSize:9,background:'rgba(0,200,120,.05)',border:'1px solid rgba(0,200,120,.12)',color:'rgba(0,200,120,.55)',borderRadius:1}}>{a.category}</span>
                        </div>
                      </div>
                      <div style={{fontSize:11,color:'rgba(180,220,200,.5)',lineHeight:1.7}}>{a.summary.slice(0,200)}{a.summary.length>200?'...':''}</div>
                      <div style={{marginTop:7,display:'flex',justifyContent:'space-between'}}>
                        <span style={{fontSize:10,color:'rgba(0,200,120,.38)'}}>- {a.source}</span>
                        <span style={{fontSize:10,color:'rgba(0,200,120,.25)'}}>{a.date}</span>
                      </div>
                    </div>
                  );
                })}
              </div>

              {/* DETAIL PANEL */}
              {sel&&(
                <div style={{width:280,flexShrink:0,background:'rgba(0,10,7,.94)',border:'1px solid rgba(0,200,120,.18)',borderRadius:2,padding:16,position:'sticky',top:0,maxHeight:'calc(100vh - 200px)',overflowY:'auto'}}>
                  <div style={{fontSize:8,letterSpacing:3,color:'rgba(0,200,120,.35)',marginBottom:10}}>SIGNAL DETAIL</div>
                  <div style={{fontSize:12,color:'#d8f0e4',fontWeight:700,lineHeight:1.55,marginBottom:10}}>{sel.title}</div>
                  <div style={{padding:'7px 10px',marginBottom:10,background:RB(sel.risk),border:'1px solid '+RC(sel.risk)+'30',borderRadius:1}}>
                    <span style={{fontSize:9,letterSpacing:2,color:RC(sel.risk),fontWeight:700}}>RISK: {sel.risk.toUpperCase()}</span>
                  </div>
                  <div style={{fontSize:11,color:'rgba(180,220,200,.68)',lineHeight:1.8,marginBottom:12}}>{sel.summary}</div>
                  <div style={{borderTop:'1px solid rgba(0,200,120,.1)',paddingTop:10,marginBottom:12}}>
                    {[['SOURCE',sel.source],['CATEGORY',sel.category],['DATE',sel.date]].map(([k,v])=>(
                      <div key={k} style={{display:'flex',justifyContent:'space-between',marginBottom:6}}>
                        <span style={{fontSize:9,color:'rgba(0,200,120,.35)',letterSpacing:1.5}}>{k}</span>
                        <span style={{fontSize:10,color:'rgba(180,220,200,.68)'}}>{v}</span>
                      </div>
                    ))}
                  </div>
                  {/* Link verification */}
                  {(()=>{
                    const st=linkSt[sel.id];
                    const stColor=st==='ok'?'#00c878':st==='fail'?'#ff4040':st==='timeout'?'#ffaa00':'rgba(0,200,120,.38)';
                    const stLabel=st==='checking'?'CHECKING...':st==='ok'?'VERIFIED':st==='fail'?'UNREACHABLE':st==='timeout'?'TIMED OUT':'NOT CHECKED';
                    return(
                      <div style={{marginBottom:8}}>
                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'5px 8px',background:'rgba(0,15,10,.6)',border:'1px solid '+stColor+'25',borderBottom:'none',borderRadius:'2px 2px 0 0'}}>
                          <span style={{fontSize:8,letterSpacing:1.5,color:stColor,display:'flex',alignItems:'center',gap:4}}>
                            {st==='checking'&&React.createElement('span',{className:'spin-anim'},'+')}{' '}{stLabel}
                          </span>
                          <button onClick={()=>verifyLink(sel.id,sel.link)} className="btn" disabled={st==='checking'}
                            style={{fontSize:7,letterSpacing:1,background:'transparent',border:'1px solid '+stColor+'35',color:stColor,padding:'1px 6px',borderRadius:1}}>
                            CHECK
                          </button>
                        </div>
                        <a href={sel.link} target="_blank" rel="noopener noreferrer" style={{display:'block',textDecoration:'none'}}>
                          <div style={{padding:'7px 8px',background:'rgba(0,200,120,.06)',border:'1px solid rgba(0,200,120,.2)',borderBottom:'none'}}>
                            <div style={{fontSize:8,color:'rgba(0,200,120,.45)',marginBottom:2}}>VIEW SOURCE</div>
                            <div style={{fontSize:10,color:'#00c878',fontWeight:600}}>{sel.linkLabel}</div>
                          </div>
                          <div style={{padding:'5px 8px',background:'rgba(0,70,40,.08)',border:'1px solid rgba(0,200,120,.12)',borderRadius:'0 0 2px 2px'}}>
                            <div style={{fontSize:9,color:'rgba(0,200,120,.45)'}}>{sel.linkNote}</div>
                          </div>
                        </a>
                      </div>
                    );
                  })()}
                  <button onClick={()=>setSel(null)} className="btn"
                    style={{display:'block',width:'100%',padding:'6px',fontSize:9,letterSpacing:2,background:'transparent',border:'1px solid rgba(0,200,120,.1)',color:'rgba(0,200,120,.35)',borderRadius:1,marginTop:4}}>
                    CLOSE
                  </button>
                </div>
              )}
            </>
          )}

          {/* KEYWORDS TAB */}
          {tab==='keywords'&&(
            <div style={{flex:1}}>
              <div style={{fontSize:9,letterSpacing:3,color:'rgba(0,200,120,.38)',marginBottom:12}}>
                KEYWORD SCAN - {kwResults.length} SIGNAL{kwResults.length!==1?'S':''} MATCHED
              </div>
              <div style={{marginBottom:12,padding:'8px 12px',background:'rgba(0,15,10,.5)',border:'1px solid rgba(0,200,120,.1)',borderRadius:2,display:'flex',flexWrap:'wrap',gap:5,alignItems:'center'}}>
                <span style={{fontSize:9,color:'rgba(0,200,120,.4)'}}>Watching:</span>
                {keywords.map(kw=>(
                  <span key={kw} style={{padding:'1px 8px',background:'rgba(0,180,100,.1)',border:'1px solid rgba(0,180,100,.2)',color:'#00c878',borderRadius:8,fontSize:10}}>{kw}</span>
                ))}
              </div>
              {kwResults.length===0&&(
                <div style={{textAlign:'center',color:'rgba(0,200,120,.28)',marginTop:50,fontSize:11,letterSpacing:2}}>
                  {alerts.length===0?'RUN SCAN FIRST THEN SCAN KEYWORDS':'NO KEYWORD MATCHES FOUND'}
                </div>
              )}
              {kwResults.filter(a=>search===''||a.title.toLowerCase().includes(search.toLowerCase())).map((a,i)=>{
                const matched=keywords.filter(kw=>(a.title+' '+a.summary+(a.kw||[]).join(' ')).toLowerCase().includes(kw.toLowerCase()));
                const f=freshness(daysOld(a.date));
                return(
                  <div key={a.id} className="card"
                    style={{padding:'12px 14px',marginBottom:6,background:'rgba(0,12,8,.6)',border:'1px solid rgba(0,200,120,.08)',borderLeft:'3px solid '+RC(a.risk),animationDelay:i*15+'ms'}}>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:5,gap:8}}>
                      <div style={{fontSize:12,color:'#d8f0e4',fontWeight:700,flex:1}}>{a.title}</div>
                      <div style={{display:'flex',gap:4,flexShrink:0}}>
                        <span style={{padding:'1px 6px',fontSize:8,background:f.color+'18',border:'1px solid '+f.color+'50',color:f.color,borderRadius:1}}>{f.label}</span>
                        <span style={{padding:'2px 7px',fontSize:9,background:RB(a.risk),border:'1px solid '+RC(a.risk)+'40',color:RC(a.risk),borderRadius:1,fontWeight:700}}>{a.risk.toUpperCase()}</span>
                      </div>
                    </div>
                    <div style={{fontSize:11,color:'rgba(180,220,200,.5)',lineHeight:1.7,marginBottom:8}}>{a.summary.slice(0,200)}</div>
                    <div style={{display:'flex',gap:4,flexWrap:'wrap',alignItems:'center'}}>
                      <span style={{fontSize:9,color:'rgba(0,200,120,.38)'}}>MATCHED:</span>
                      {matched.map(kw=>(
                        <span key={kw} style={{padding:'1px 8px',fontSize:9,background:'rgba(0,230,130,.1)',border:'1px solid rgba(0,230,130,.22)',color:'#00e87a',borderRadius:8}}>{kw}</span>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {/* BRIEF TAB */}
          {tab==='brief'&&(
            <div style={{flex:1}}>
              <div style={{fontSize:9,letterSpacing:3,color:'rgba(0,200,120,.38)',marginBottom:14}}>
                STRATEGIC INTELLIGENCE BRIEF - {new Date().toDateString().toUpperCase()}
              </div>
              {[
                {t:'Critical Risk Summary',r:'High',c:hi+' high-risk signals detected this scan cycle. Key threats include phase-out language, CBAM expansion, and ambiguous fossil fuel framing in negotiation texts. Immediate counter-narrative preparation recommended for Arab Group delegations before upcoming sessions.'},
                {t:'Narrative Vulnerability Assessment',r:'High',c:'Narrative Shift Index reflects live keyword frequency across '+alerts.length+' scanned signals. Topics with upward trends require active diplomatic response. CBAM and net-zero pressure currently represent the highest velocity indicators.'},
                {t:'Coalition Opportunity',r:'Low',c:'African and developing nation positions increasingly align with Arab Group on historical responsibility and just transition equity. Pre-COP outreach to these blocs could expand the negotiating coalition and strengthen common positions on loss and damage.'},
                {t:'Recommended Strategic Actions',r:'Medium',c:'1. Monitor CBAM and phase-out language trends across each scan cycle.\n2. Prepare technical rebuttals to IEA oil demand forecasts.\n3. Build coalition around equity and historical responsibility framing.\n4. Leverage Saudi Vision 2030 and CCS investments as positive counter-narratives.\n5. Engage African coalition delegations before COP31.'},
              ].map((s,i)=>(
                <div key={i} style={{padding:'14px 16px',marginBottom:10,background:'rgba(0,10,7,.65)',border:'1px solid '+RC(s.r)+'15',borderLeft:'3px solid '+RC(s.r),borderRadius:1}}>
                  <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}>
                    <div style={{fontSize:12,color:'#00e87a',fontWeight:700}}>{s.t}</div>
                    <span style={{padding:'2px 8px',fontSize:9,background:RB(s.r),color:RC(s.r),border:'1px solid '+RC(s.r)+'35',borderRadius:1,fontWeight:700}}>{s.r.toUpperCase()}</span>
                  </div>
                  <div style={{fontSize:11,color:'rgba(180,220,200,.7)',lineHeight:1.85,whiteSpace:'pre-line'}}>{s.c}</div>
                </div>
              ))}
              {/* OFFICIAL DOCUMENTS REFERENCE PANEL */}
              <div style={{marginTop:16,padding:'14px 16px',background:'rgba(0,8,5,.7)',border:'1px solid rgba(0,200,120,.15)',borderLeft:'3px solid rgba(0,200,120,.4)',borderRadius:1}}>
                <div style={{fontSize:11,color:'#00e87a',fontWeight:700,marginBottom:10}}>OFFICIAL DECISION DATABASES</div>
                <div style={{fontSize:9,color:'rgba(0,200,120,.45)',marginBottom:12,letterSpacing:1}}>Direct links to UNFCCC decisions, IPCC reports, and NDC registry for primary source verification</div>
                {OFFICIAL_DOCS.map((d,i)=>(
                  <a key={i} href={d.url} target='_blank' rel='noopener noreferrer'
                    style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',padding:'8px 10px',marginBottom:5,background:'rgba(0,200,120,.04)',border:'1px solid rgba(0,200,120,.1)',borderRadius:1,textDecoration:'none',transition:'background .15s'}}
                    onMouseOver={e=>e.currentTarget.style.background='rgba(0,200,120,.09)'}
                    onMouseOut={e=>e.currentTarget.style.background='rgba(0,200,120,.04)'}>
                    <div>
                      <div style={{fontSize:10,color:'#00c878',fontWeight:600,marginBottom:2}}>{d.name}</div>
                      <div style={{fontSize:9,color:'rgba(0,200,120,.45)'}}>{d.desc}</div>
                    </div>
                    <span style={{fontSize:9,color:'rgba(0,200,120,.4)',flexShrink:0,marginLeft:8,marginTop:2}}>-&gt;</span>
                  </a>
                ))}
              </div>
            </div>
          )}

        </div>
      </div>
    </div>
  </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
<script>
// Anti-theft
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{
  if(e.key==='F12'||(e.ctrlKey&&e.shiftKey&&['I','J','C'].includes(e.key))||(e.ctrlKey&&e.key==='U'))e.preventDefault();
});
window.addEventListener('beforeprint',()=>{document.title='CONFIDENTIAL - Naif Alsalem - Climate Radar';});
</script>
</body>
</html>
